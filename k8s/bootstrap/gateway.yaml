apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: local-cluster-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP

---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: local-cluster-config
    namespace: envoy-gateway-system
---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: envoy-gateway-system
#  annotations:
#    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: eg
  listeners:
    # every site straight from the home ip on 443, through gateway-forwarder (gateway-forwarder.yaml), with
    # pbonard-tls (pbonard-cert.yaml). the backend and holidayfriend routes name no listener: they attach to theirs by
    # hostname and namespace
    - name: backend-https
      hostname: "backend.pbonard.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: pbonard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: holidayfriend-https
      hostname: "holidayfriend.pbonard.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: pbonard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: holidayfriend
    # github's argo cd webhook, the only route on it is POST /api/webhook (argocd-webhook.yaml)
    - name: argocd-webhook-https
      hostname: "argocd-webhook.pbonard.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: pbonard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    # garage's s3 api, the route is garage.yaml's garage-s3
    - name: s3-https
      hostname: "s3.pbonard.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: pbonard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: garage
