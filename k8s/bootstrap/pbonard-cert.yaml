# one certificate per site, each for an https listener of gateway.yaml. not one *.pbonard.com for all: a browser may reuse
# an http/2 connection for every name its certificate covers and end up on another site's listener, so envoy gateway
# turns http/2 off when listeners' certificates overlap. a new site needs its own here. dns01 through cloudflare's api:
# the names are dns only and point home, and nothing listens on port 80 for an http01 challenge
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: backend-pbonard-tls
  namespace: envoy-gateway-system
spec:
  secretName: backend-pbonard-tls
  dnsNames:
    - "backend.pbonard.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
---
