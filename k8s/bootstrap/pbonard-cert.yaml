# *.pbonard.com's certificate, for every https listener of gateway.yaml. dns01 through cloudflare's api: the names are
# dns only and point home, and nothing listens on port 80 for an http01 challenge
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pbonard-tls
  namespace: envoy-gateway-system
spec:
  secretName: pbonard-tls
  dnsNames:
    - "*.pbonard.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
