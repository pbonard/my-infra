# single node opensearch, replaces the aiven service. The operator is helm_release.opensearch_operator
# opensearch-backend-user secret should be deployed already (bootstrap.sh)
apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: opensearch
  namespace: opensearch
spec:
  general:
    # the backend connects to http://opensearch.opensearch.svc.cluster.local:9200
    serviceName: opensearch
    version: 3.9.0
    httpPort: 9200
    # vm.max_map_count 262144 through a privileged init container, opensearch refuses to start below it
    setVMMaxMapCount: true
  security:
    tls:
      # node to node traffic, certs generated by the operator
      transport:
        generate: true
      # plain http inside the cluster, nothing outside reaches it
      http:
        enabled: false
  # the admin password is generated by the operator into opensearch-admin-password
  nodePools:
    - component: nodes
      replicas: 1
      # one node holds every role, a lost disk loses the indices
      roles:
        - cluster_manager
        - data
        - ingest
      diskSize: 5Gi
      persistence:
        pvc:
          storageClass: local-path
          accessModes:
            - ReadWriteOnce
      # heap is half the memory, lucene uses the rest through the page cache
      jvm: -Xms1536m -Xmx1536m
      resources:
        requests:
          memory: 3Gi
          cpu: 500m
        limits:
          memory: 3Gi
---
# no second node to hold replicas, indices would stay yellow with the default of 1
# an index template of the app with a higher priority replaces this one, set replicas 0 there too
apiVersion: opensearch.org/v1
kind: OpensearchIndexTemplate
metadata:
  name: single-node
  namespace: opensearch
spec:
  opensearchCluster:
    name: opensearch
  name: single-node
  indexPatterns:
    - "*"
  priority: 0
  template:
    settings:
      index:
        number_of_replicas: 0
---
# the backend's own user, OPENSEARCH_USERNAME is backend
apiVersion: opensearch.org/v1
kind: OpensearchUser
metadata:
  name: backend
  namespace: opensearch
spec:
  opensearchCluster:
    name: opensearch
  passwordFrom:
    name: opensearch-backend-user
    key: OPENSEARCH_PASSWORD
---
apiVersion: opensearch.org/v1
kind: OpensearchRole
metadata:
  name: backend
  namespace: opensearch
spec:
  opensearchCluster:
    name: opensearch
  clusterPermissions:
    - cluster_composite_ops
    - cluster_monitor
    # index templates and ingest pipelines
    - cluster_manage_index_templates
    - cluster_manage_pipelines
  # system indices stay protected by the security plugin
  indexPermissions:
    - indexPatterns:
        - "*"
      allowedActions:
        - indices_all
---
apiVersion: opensearch.org/v1
kind: OpensearchUserRoleBinding
metadata:
  name: backend
  namespace: opensearch
spec:
  opensearchCluster:
    name: opensearch
  users:
    - backend
  roles:
    - backend
