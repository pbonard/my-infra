# single node garage, the s3 replacement for the chat bucket. The operator is helm_release.garage_operator
# garage-admin-token secret should be deployed already (bootstrap.sh)
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: garage
  namespace: garage
spec:
  zone: home
  # one node holds the only copy, a lost disk loses the objects
  replication:
    factor: 1
  storage:
    replicas: 1
    metadata:
      size: 1Gi
    data:
      size: 5Gi
  s3Api:
    region: garage
  network:
    service:
      type: ClusterIP
  admin:
    adminTokenSecretRef:
      name: garage-admin-token
      key: admin-token
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: chat-bucket
  namespace: garage
spec:
  clusterRef:
    name: garage
  globalAlias: chat-bucket
  # kubectl delete of the resource never drops the objects
  deletionPolicy: Retain
---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: backend
  namespace: garage
spec:
  clusterRef:
    name: garage
  neverExpires: true
  bucketPermissions:
    - bucketRef:
        name: chat-bucket
      read: true
      write: true
      # owner: changing the bucket's settings, its CORS rules (s3api put-bucket-cors), which let the holidayfriend web
      # app upload from the browser. the operator has no field for CORS, so they're set once through the S3 API
      owner: true
  # aws sdks read these env names directly, AWS_ENDPOINT_URL included. reflected to backend like k8ssandra's superuser
  secretTemplate:
    name: garage-s3
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    endpointKey: AWS_ENDPOINT_URL
    regionKey: AWS_REGION
    hostKey: S3_HOST
    schemeKey: S3_SCHEME
    includeBucketName: true
    bucketNameKey: S3_BUCKET
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "backend,holidayfriend"
---
# flink's checkpoints, savepoints and ha metadata, s3://flink-state/<job>/...
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: flink-state
  namespace: garage
spec:
  clusterRef:
    name: garage
  globalAlias: flink-state
  deletionPolicy: Retain
  # flink only deletes the old checkpoints of a running job id. the last checkpoint of a replaced job id
  # (RETAIN_ON_CANCELLATION) and hand triggered savepoints stay, these rules expire them. prefixes take no
  # wildcards, so a new job in my-server values.yaml needs its own rules here.
  # <job>/ha/ has no rule, its jar blobs and job graph are written once at start and stay in use.
  # the checkpoint rules rely on full checkpoints (hashmap backend), every live file is at most 10s old.
  # incremental rocksdb checkpoints keep old but still referenced files in shared/, drop the rules before switching
  lifecycle:
    rules:
      - id: abort-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 1
      - id: cdc-job-checkpoints
        status: Enabled
        filter:
          prefix: cdc-job/checkpoints/
        expirationDays: 7
      - id: cdc-job-savepoints
        status: Enabled
        filter:
          prefix: cdc-job/savepoints/
        expirationDays: 30
      - id: exponential-backoff-retry-job-checkpoints
        status: Enabled
        filter:
          prefix: exponential-backoff-retry-job/checkpoints/
        expirationDays: 7
      - id: exponential-backoff-retry-job-savepoints
        status: Enabled
        filter:
          prefix: exponential-backoff-retry-job/savepoints/
        expirationDays: 30
      - id: scheduled-notification-job-checkpoints
        status: Enabled
        filter:
          prefix: scheduled-notification-job/checkpoints/
        expirationDays: 7
      - id: scheduled-notification-job-savepoints
        status: Enabled
        filter:
          prefix: scheduled-notification-job/savepoints/
        expirationDays: 30
---
# flink's own key, only flink-state. the s3 plugin reads AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from env
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: flink
  namespace: garage
spec:
  clusterRef:
    name: garage
  neverExpires: true
  bucketPermissions:
    - bucketRef:
        name: flink-state
      read: true
      write: true
  secretTemplate:
    name: garage-flink
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "flink"
---
# the apps upload (presigned POST) and fetch (presigned GET) objects at s3.pbonard.com, straight from the home ip like
# every site (gateway-forwarder.yaml). garage checks the signature of each, an unsigned request gets 403
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
  namespace: garage
spec:
  parentRefs:
    # gateway.yaml's s3-https
    - name: cluster-gateway
      namespace: envoy-gateway-system
      sectionName: s3-https
  hostnames:
    - s3.pbonard.com
  rules:
    - matches:
        - method: GET
        - method: HEAD
        - method: POST
        # a browser's CORS preflight, which an upload whose progress is watched (the holidayfriend web app's) sends
        # first. garage answers it from the bucket's CORS rules, it reads and changes nothing
        - method: OPTIONS
        # the blog's publish command. only its bucket, no other is written with PUT from outside. garage checks the
        # signature here too
        - method: PUT
          path:
            type: PathPrefix
            value: /blog/
      backendRefs:
        - name: garage
          port: 3900
---
# the blog: its pages, photos and videos, uploaded with the blog repo's publish command. public: the website endpoint
# serves its objects without a signature, through the blog route below
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: blog
  namespace: garage
spec:
  clusterRef:
    name: garage
  globalAlias: blog
  deletionPolicy: Retain
  website:
    enabled: true
    indexDocument: index.html
    errorDocument: 404.html
  # chat and flink share the same 5Gi disk
  quotas:
    maxSize: 1Gi
---
# the blog's own key, only its bucket. its secret stays in this namespace, the publish command reads a copy
# of it, the blog repo's upload.toml
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: blog
  namespace: garage
spec:
  clusterRef:
    name: garage
  neverExpires: true
  bucketPermissions:
    - bucketRef:
        name: blog
      read: true
      write: true
  secretTemplate:
    name: garage-blog
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
---
# blog.pbonard.com is garage's website endpoint. it picks the bucket by the host, and the rewrite always names
# blog, so no other bucket can be reached here
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog
  namespace: garage
spec:
  parentRefs:
    # gateway.yaml's blog-https
    - name: cluster-gateway
      namespace: envoy-gateway-system
      sectionName: blog-https
  hostnames:
    - blog.pbonard.com
  rules:
    - matches:
        - method: GET
        - method: HEAD
      filters:
        - type: URLRewrite
          urlRewrite:
            # <bucket> before the web api's root domain (garage.yaml's cluster, .garage.garage.svc)
            hostname: blog.garage.garage.svc
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
      backendRefs:
        - name: garage
          port: 3902
---
# garage doesn't compress, the gateway does
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: blog-compression
  namespace: garage
spec:
  # merged with the gateway's per-ip rate limit (rate-limit.yaml), without it this policy wins over the gateway's
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: blog
  compressor:
    - type: Gzip
      gzip: {}
