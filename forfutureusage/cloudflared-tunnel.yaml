# the cloudflare tunnel every site went through before it was served straight from the home ip (removed on
# 2026-11-17: cloudflare's free plan sent korean users through los angeles). kept to bring back, with
# cloudflared-tunnel.tf for the tunnel and its dns.
# to bring back: apply cloudflared-tunnel.tf, put its tunnel_token output in a secret "cloudflared" (TUNNEL_TOKEN) in
# default, apply this, and give cluster-gateway plain http listeners on 80 (hostname per site) without the
# gateway-proxy-protocol ClientTrafficPolicy on them: cloudflared sends no PROXY header

# where the tunnel's ingress rules send every hostname: the gateway's http listeners. envoy gateway runs a listener
# under 1024 on its port + 10000
apiVersion: v1
kind: Service
metadata:
  name: static-envoy-ingress
  namespace: envoy-gateway-system
spec:
  type: ClusterIP
  selector:
    gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
    gateway.envoyproxy.io/owning-gateway-name: cluster-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 10080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
          envFrom:
            - secretRef:
                name: cloudflared
